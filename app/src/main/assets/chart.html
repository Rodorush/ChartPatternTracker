<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/dist/dxchart.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "@devexperts/dxcharts-lite/": "https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/"
            }
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        /* Garante que o contêiner tenha altura renderizável dentro do WebView */
        #chart {
            width: 100%;
            height: 100vh; /* evita altura 0 quando body não tem altura explícita */
            position: relative; /* para overlays absolutos dos padrões */
        }
        .pattern-rect {
            position: absolute;
            border: 1px dashed rgba(255,165,0,1);
            background-color: rgba(255,165,0,0.12);
            pointer-events: none;
            z-index: 10;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    console.log("Starting chart.html script execution");
    console.log("DXChart available:", typeof DXChart !== 'undefined');

    let chart;
    // Guarda os candles atuais (centros) para calcular bordas entre velas
    let currentCandles = [];
    // Overlays DOM para padrões (fallback)
    let patternRectEls = [];
    let patternRectsData = [];
    let scaleListenersAttached = false;
    // Modelos dinâmicos ancorados no canvas
    let patternRectModels = [];

    function initializeChart() {
        try {
            if (typeof DXChart === 'undefined') {
                console.error("DXChart is not loaded");
                return;
            }

            console.log("Creating chart...");
            const orange = 'rgba(255,165,0,1)';
            const orangeBg = 'rgba(255,165,0,0.12)';
            const config = {
                highlights: {
                    visible: true,
                    border: { width: 2, dash: [6, 3] }
                },
                colors: {
                    highlights: {
                        REGULAR: { border: orange, background: orangeBg, label: orangeBg }
                    }
                }
            };
            chart = DXChart.createChart(document.getElementById('chart'), config);
            console.log("Chart created:", chart !== null && typeof chart === 'object');
            console.log('Highlights color configured to orange.');
            try {
                chart.setChartType('candle');
                console.log('Chart type set to candle');
            } catch (e) {
                console.warn('Failed to set chart type to candle:', e);
            }

            // Log container size to ensure it has renderable dimensions
            const el = document.getElementById('chart');
            const rect = el.getBoundingClientRect();
            console.log('Chart container size:', rect.width + 'x' + rect.height);
            if (rect.height === 0 || rect.width === 0) {
                console.warn('Chart container has zero size; check CSS/layout.');
                try {
                    const fallback = Math.max(300, window.innerHeight || screen.height || 0);
                    if (fallback > 0) {
                        el.style.height = fallback + 'px';
                        const r2 = el.getBoundingClientRect();
                        console.log('Applied fallback height, new size:', r2.width + 'x' + r2.height);
                    }
                } catch (_) {}
            }

            console.log("Chart initialized successfully");
            try { attachScaleListeners(); } catch(_) {}
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error("Error initializing chart:", e);
        }
    }

    function clearPatternRects() {
        try {
            const container = document.getElementById('chart');
            patternRectEls.forEach(el => el && container.contains(el) && container.removeChild(el));
        } catch (_) {}
        patternRectEls = [];
        patternRectsData = [];
    }

    function clearPatternRectsDynamic() {
        try {
            const paneOrder = chart.paneManager && chart.paneManager.panesOrder;
            const panes = (chart.paneManager && chart.paneManager.panes) || {};
            const paneId = Array.isArray(paneOrder) && paneOrder.length > 0 ? paneOrder[0] : Object.keys(panes)[0];
            if (paneId) {
                patternRectModels.forEach(m => chart.dynamicObjects.model.removeObject(m, paneId));
            }
        } catch (_) {}
        patternRectModels = [];
    }

    function findCandleIndex(ts) {
        if (!Array.isArray(currentCandles) || currentCandles.length === 0) return -1;
        // Busca exata
        for (let i = 0; i < currentCandles.length; i++) {
            if (currentCandles[i].timestamp === ts) return i;
        }
        // Caso não encontre, acha o mais próximo (fallback)
        let best = 0, bestDiff = Math.abs(currentCandles[0].timestamp - ts);
        for (let i = 1; i < currentCandles.length; i++) {
            const d = Math.abs(currentCandles[i].timestamp - ts);
            if (d < bestDiff) { best = i; bestDiff = d; }
        }
        return best;
    }

    function leftEdgeTimestamp(index) {
        if (!Array.isArray(currentCandles) || currentCandles.length === 0) return 0;
        const t = currentCandles.map(c => c.timestamp);
        if (index <= 0) {
            const step = t.length > 1 ? (t[1] - t[0]) : 0;
            return t[0] - step / 2;
        }
        return (t[index - 1] + t[index]) / 2;
    }

    function rightEdgeTimestamp(index) {
        if (!Array.isArray(currentCandles) || currentCandles.length === 0) return 0;
        const t = currentCandles.map(c => c.timestamp);
        if (index >= t.length - 1) {
            const step = t.length > 1 ? (t[t.length - 1] - t[t.length - 2]) : 0;
            return t[t.length - 1] + step / 2;
        }
        return (t[index] + t[index + 1]) / 2;
    }

    function applyPatternRectangles(rects) {
        try {
            const paneOrder = chart.paneManager && chart.paneManager.panesOrder;
            const panes = (chart.paneManager && chart.paneManager.panes) || {};
            const paneId = Array.isArray(paneOrder) && paneOrder.length > 0 ? paneOrder[0] : Object.keys(panes)[0];
            const pane = panes[paneId];
            const container = document.getElementById('chart');
            const dbg = {
                paneOrder: paneOrder,
                paneId: paneId,
                rectCount: Array.isArray(rects) ? rects.length : 0
            };
            try { console.log('applyPatternRectangles:', JSON.stringify(dbg)); } catch(_) {}
            if (!pane || !container) {
                console.warn('No pane/container; skipping pattern rectangles');
                return;
            }
            clearPatternRects();
            clearPatternRectsDynamic();

            // Adiciona objetos dinâmicos ancorados ao canvas
            rects.forEach((r, idx) => {
                if (typeof r.from !== 'number' || typeof r.to !== 'number' || typeof r.min !== 'number' || typeof r.max !== 'number') return;
                // Determina os candles incluídos no padrão pelo intervalo [from, to)
                let included = [];
                if (Array.isArray(currentCandles) && currentCandles.length > 0) {
                    for (let i = 0; i < currentCandles.length; i++) {
                        const ts = currentCandles[i].timestamp;
                        if (ts >= r.from && ts < r.to) included.push(i);
                    }
                }
                let startIdx, endIdx;
                if (included.length > 0) {
                    startIdx = included[0];
                    endIdx = included[included.length - 1];
                } else {
                    // Fallback se não houver match exato
                    startIdx = findCandleIndex(r.from);
                    endIdx = Math.max(startIdx, findCandleIndex(r.to));
                }
                const model = { startIdx, endIdx, min: r.min, max: r.max };
                const drawer = {
                    draw: function(canvasModel, mdl /*, paneUUID */) {
                        try {
                            const ctx = canvasModel.ctx;
                            const toXIdx = chart.data && chart.data.toXFromCandleIndex ? chart.data.toXFromCandleIndex.bind(chart.data) : null;
                            if (!toXIdx) return;
                            // Centros das velas de início e fim
                            const xStart = toXIdx(mdl.startIdx);
                            const xEnd = toXIdx(mdl.endIdx);
                            // Centro da anterior ao início (ou extrapolação)
                            let xPrev;
                            if (mdl.startIdx > 0) {
                                xPrev = toXIdx(mdl.startIdx - 1);
                            } else {
                                // extrapola delta a partir das duas primeiras
                                const x1 = toXIdx(0), x2 = toXIdx(1);
                                xPrev = x1 - (x2 - x1);
                            }
                            // Centro da próxima ao fim (ou extrapolação)
                            let xNext;
                            try {
                                xNext = toXIdx(mdl.endIdx + 1);
                            } catch (_) {
                                xNext = undefined;
                            }
                            if (typeof xNext !== 'number' || isNaN(xNext)) {
                                const xN1 = mdl.endIdx > 0 ? toXIdx(mdl.endIdx - 1) : toXIdx(0);
                                xNext = xEnd + (xEnd - xN1);
                            }
                            // Bordas entre velas
                            const xLeft = (xPrev + xStart) / 2;
                            const xRight = (xEnd + xNext) / 2;
                            const x1 = Math.min(xLeft, xRight);
                            const x2 = Math.max(xLeft, xRight);
                            const y1 = (chart.data && chart.data.toY) ? chart.data.toY(mdl.max) : 0;
                            const y2 = (chart.data && chart.data.toY) ? chart.data.toY(mdl.min) : 0;
                            const left = x1;
                            const top = Math.min(y1, y2);
                            const w = Math.abs(x2 - x1);
                            const h = Math.abs(y2 - y1);
                            if (w <= 0 || h <= 0) return;
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(left, top, w, h);
                            ctx.fillStyle = 'rgba(255,165,0,0.12)';
                            ctx.fill();
                            ctx.lineWidth = 1;
                            try { ctx.setLineDash([6, 3]); } catch(_) {}
                            ctx.strokeStyle = 'rgba(255,165,0,0.5)';
                            ctx.stroke();
                            ctx.restore();
                        } catch (e) {
                            console.warn('Pattern rectangle draw error:', e);
                        }
                    }
                };
                chart.dynamicObjects.model.addObject({ drawer: drawer, model: model }, paneId);
                patternRectModels.push(model);
            });
            console.log('Pattern rectangles applied (dynamic):', patternRectModels.length);
        } catch (e) {
            console.warn('Failed to apply pattern rectangles:', e);
        }
    }

    function repositionPatternRectangles() {
        try {
            const container = document.getElementById('chart');
            const mainCanvas = container.querySelector('canvas');
            const containerRect = container.getBoundingClientRect();
            const canvasRect = mainCanvas ? mainCanvas.getBoundingClientRect() : containerRect;
            const dx = canvasRect.left - containerRect.left;
            const dy = canvasRect.top - containerRect.top;
            patternRectsData.forEach((r, idx) => {
                const x1 = (chart.data && typeof chart.data.toXFromTimestamp === 'function') ? chart.data.toXFromTimestamp(r.from) : chart.scale.toX(r.from);
                const x2 = (chart.data && typeof chart.data.toXFromTimestamp === 'function') ? chart.data.toXFromTimestamp(r.to) : chart.scale.toX(r.to);
                const y1 = (chart.data && typeof chart.data.toY === 'function') ? chart.data.toY(r.max) : 0;
                const y2 = (chart.data && typeof chart.data.toY === 'function') ? chart.data.toY(r.min) : 0;
                const left = Math.min(x1, x2);
                const top = Math.min(y1, y2);
                const w = Math.abs(x2 - x1);
                const h = Math.abs(y2 - y1);
                const absLeft = dx + left;
                const absTop = dy + top;
                const el = r.el;
                el.style.left = absLeft + 'px';
                el.style.top = absTop + 'px';
                el.style.width = w + 'px';
                el.style.height = h + 'px';
                try { console.log('Rect['+idx+'] DOM pixels:', JSON.stringify({ left: absLeft, top: absTop, w, h })); } catch(_) {}
            });
        } catch (e) {
            console.warn('Failed to reposition pattern rectangles:', e);
        }
    }

    function attachScaleListeners() {
        if (scaleListenersAttached) return;
        try {
            if (chart && chart.scale && chart.scale.xChanged && chart.scale.yChanged) {
                chart.scale.xChanged.subscribe(() => repositionPatternRectangles());
                chart.scale.yChanged.subscribe(() => repositionPatternRectangles());
                scaleListenersAttached = true;
                console.log('Scale listeners attached');
            }
        } catch (e) {
            console.warn('Failed to attach scale listeners:', e);
        }
    }

    window.updateChart = function(jsonData) {
        if (!chart) {
            console.error("Chart not initialized. Call initializeChart first.");
            return;
        }
        try {
            const parsed = (typeof jsonData === 'string') ? JSON.parse(jsonData) : jsonData;
            try { console.log("Raw data received:", JSON.stringify(parsed)); } catch(_) { console.log('Raw data received [object]'); }

            const data = Array.isArray(parsed) ? parsed : (parsed.candles || []);

            // Verificar a última vela e ignorá-la se tiver OHLC com zero
            let finalData = data;
            if (Array.isArray(data) && data.length > 0) {
                const lastCandle = data[data.length - 1];
                try { console.log("Last candle:", JSON.stringify(lastCandle)); } catch(_) { console.log('Last candle [object]'); }
                // dxcharts-lite usa chaves: open, close, hi, lo, timestamp
                if (lastCandle.open === 0 || lastCandle.hi === 0 || lastCandle.lo === 0 || lastCandle.close === 0) {
                    console.log("Ignoring last candle due to zero OHLC value");
                    finalData = data.slice(0, -1); // Remove a última vela
                }
            }

            try {
                chart.setData({ candles: finalData });
                currentCandles = finalData; // guarda para cálculo de bordas entre velas
            } catch (e) {
                console.error("Error setting chart data:", e);
            }

            try {
                chart.setAutoScale(true);
            } catch (e) {
                console.error("Error setting auto scale:", e);
            }
            // Aplicar destaques: se vierem com min/max, desenhar retângulos limitados (dinâmicos);
            // caso contrário, usar highlights padrão por tempo.
            try {
                const highlights = (!Array.isArray(parsed) && parsed.highlights) ? parsed.highlights : [];
                if (Array.isArray(highlights) && highlights.length > 0) {
                    const hasYBounds = highlights.some(h => typeof h.min === 'number' && typeof h.max === 'number');
                    if (hasYBounds) {
                        applyPatternRectangles(highlights);
                        chart.highlights.setHighlights([]);
                    } else {
                        // Deriva min/max a partir dos candles no intervalo [from, to)
                        const rects = highlights.map(h => {
                            const from = h.from, to = h.to;
                            const selected = finalData.filter(c => typeof c.timestamp === 'number' && c.timestamp >= from && c.timestamp < to);
                            let min = Infinity, max = -Infinity;
                            for (const c of selected) {
                                if (typeof c.lo === 'number') min = Math.min(min, c.lo);
                                if (typeof c.hi === 'number') max = Math.max(max, c.hi);
                            }
                            if (!isFinite(min) || !isFinite(max)) return null;
                            return { from, to, min, max };
                        }).filter(Boolean);
                        applyPatternRectangles(rects);
                        chart.highlights.setHighlights([]);
                    }
                } else {
                    chart.highlights.setHighlights([]);
                    applyPatternRectangles([]);
                }
            } catch (e) {
                console.warn('Failed to apply highlights/rectangles:', e);
            }
            // Try again on next frame to ensure layout applied
            try {
                requestAnimationFrame(() => chart.setAutoScale(true));
            } catch (e) {
                console.warn('AutoScale on next frame failed:', e);
            }
            console.log("Chart updated with data, count:", finalData.length);
            try { setTimeout(() => {
                try {
                    const el2 = document.getElementById('chart');
                    const r3 = el2.getBoundingClientRect();
                    console.log('Post-update size:', r3.width + 'x' + r3.height);
                    chart.setAutoScale(true);
                } catch (e) { console.warn('Post-update autoscale failed:', e); }
            }, 100); } catch (_e) {}
        } catch (e) {
            console.error("Error updating chart:", e);
        }
    };

    window.onload = function() {
        console.log("Window loaded, initializing chart...");
        initializeChart();
    };

    window.addEventListener('resize', () => {
        try {
            const rect = document.getElementById('chart').getBoundingClientRect();
            console.log('Window resize; chart container size:', rect.width + 'x' + rect.height);
            chart && chart.setAutoScale(true);
            repositionPatternRectangles();
        } catch (e) {
            console.warn('Resize handler error:', e);
        }
    });
</script>
</body>
</html>

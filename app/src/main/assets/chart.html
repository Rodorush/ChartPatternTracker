<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/dist/dxchart.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "@devexperts/dxcharts-lite/": "https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/"
        }
    }
    </script>
    <style>
        body { margin: 0; padding: 0; }
        #chart { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="chart"></div>
<script type="module">
    let chart;

    function initializeChart() {
        try {
            const container = document.getElementById('chart');
            chart = DXChart.createChart(container, {
                colors: {
                    highlights: {
                        REGULAR: {
                            background: 'rgba(0, 0, 255, 0.2)',
                            border: '#0000FF'
                        }
                    }
                }
            });
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error('Error initializing chart:', e);
        }
    }

    window.updateChart = function(jsonData) {
        if (!chart) {
            console.error('Chart not initialized.');
            return;
        }
        try {
            const data = JSON.parse(jsonData);
            chart.setData({ candles: data.candles });
            const highlightsComponent = chart.getComponent('highlights');
            highlightsComponent.setHighlights(data.highlights || []);
        } catch (e) {
            console.error('Error updating chart:', e);
        }
    };

    window.onload = function() {
        initializeChart();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@devexperts/dxcharts-lite@2.0.1/dist/dxchart.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #chart { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    console.log("Starting chart.html script execution");
    console.log("DXChart available:", typeof DXChart !== 'undefined');

    let chart;

    function initializeChart() {
        try {
            if (typeof DXChart === 'undefined') {
                console.error("DXChart is not loaded");
                return;
            }

            const container = document.getElementById('chart');
            chart = DXChart.createChart(container);

            console.log("Chart initialized successfully");
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error("Error initializing chart:", e);
        }
    }

    window.updateChart = function(jsonData) {
        if (!chart) {
            console.error("Chart not initialized. Call initializeChart first.");
            return;
        }
        try {
            const data = JSON.parse(jsonData);
            chart.setData({ candles: data });
            chart.timeScale && chart.timeScale.fitContent && chart.timeScale.fitContent();
            console.log("Chart updated with data, count:", data.length);
        } catch (e) {
            console.error("Error updating chart:", e);
        }
    };

    window.highlightPatterns = function(jsonData) {
        if (!chart || !chart.highlights) {
            console.error("Chart not initialized or highlights component missing.");
            return;
        }
        try {
            const patterns = JSON.parse(jsonData);
            const highlights = patterns.map(p => ({
                from: p.from,
                to: p.to,
                type: 'REGULAR',
                border: { left: true, right: true }
            }));
            chart.highlights.setHighlights(highlights);
        } catch (e) {
            console.error("Error highlighting patterns:", e);
        }
    };

    window.onload = function() {
        console.log("Window loaded, initializing chart...");
        initializeChart();
    };
</script>
</body>
</html>

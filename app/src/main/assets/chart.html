<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/dist/dxchart.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #chart { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    let chart;

    function initializeChart() {
        try {
            const container = document.getElementById('chart');
            chart = DXChart.createChart(container);
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error("Error initializing chart:", e);
        }
    }

    window.updateChart = function(jsonData) {
        if (!chart) {
            console.error("Chart not initialized. Call initializeChart first.");
            return;
        }
        try {
            const data = JSON.parse(jsonData);

            let finalData = data;
            if (data.length > 0) {
                const lastCandle = data[data.length - 1];
                if (lastCandle.open === 0 || lastCandle.high === 0 || lastCandle.low === 0 || lastCandle.close === 0) {
                    finalData = data.slice(0, -1);
                }
            }

            chart.setData({ candles: finalData });
        } catch (e) {
            console.error("Error updating chart:", e);
        }
    };

    window.onload = function() {
        initializeChart();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@devexperts/dxcharts-lite/dist/umd/dxcharts-lite.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #chart { position: relative; width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    let chart;
    let candleSeries;

    function initializeChart() {
        try {
            chart = DXChart.createChart(document.getElementById('chart'));
            candleSeries = chart.addCandlesSeries();
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error('Error initializing chart:', e);
        }
    }

    window.updateChart = function(candleJson, rectJson) {
        if (!chart || !candleSeries) {
            console.error('Chart not initialized. Call initializeChart first.');
            return;
        }
        try {
            const data = JSON.parse(candleJson);
            let finalData = data;
            if (data.length > 0) {
                const last = data[data.length - 1];
                if (last.open === 0 || last.high === 0 || last.low === 0 || last.close === 0) {
                    finalData = data.slice(0, -1);
                }
            }
            candleSeries.setData(finalData);
            if (chart.timeScale && chart.timeScale().fit) {
                chart.timeScale().fit();
            }
            const rectangles = rectJson ? JSON.parse(rectJson) : [];
            drawRectangles(rectangles, finalData);
        } catch (e) {
            console.error('Error updating chart:', e);
        }
    };

    function drawRectangles(rectangles, data) {
        const container = document.getElementById('chart');
        let canvas = document.getElementById('patternOverlay');
        if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.id = 'patternOverlay';
            canvas.style.position = 'absolute';
            canvas.style.left = '0';
            canvas.style.top = '0';
            container.appendChild(canvas);
        }
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (rectangles.length === 0) return;

        const allPrices = data.flatMap(d => [d.high, d.low]);
        const minPrice = Math.min(...allPrices);
        const maxPrice = Math.max(...allPrices);

        rectangles.forEach(r => {
            const startIdx = data.findIndex(d => d.time === r.startTime);
            const endIdx = data.findIndex(d => d.time === r.endTime);
            if (startIdx === -1 || endIdx === -1) return;
            const x1 = startIdx / data.length * canvas.width;
            const x2 = (endIdx + 1) / data.length * canvas.width;
            const y1 = (1 - (r.max - minPrice) / (maxPrice - minPrice)) * canvas.height;
            const y2 = (1 - (r.min - minPrice) / (maxPrice - minPrice)) * canvas.height;
            ctx.strokeStyle = 'rgba(255,165,0,0.8)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        });
    }

    window.onload = function() {
        initializeChart();
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/dist/dxchart.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #chart { width: 100%; height: 100%; position: relative; }
        .pattern-rect {
            position: absolute;
            border: 2px solid rgba(0, 0, 255, 0.5);
            background-color: rgba(0, 0, 255, 0.1);
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    console.log("Starting chart.html script execution");
    console.log("DXChart available:", typeof DXChart !== 'undefined');

    let chart;

    function initializeChart() {
        try {
            if (typeof DXChart === 'undefined') {
                console.error("DXChart is not loaded");
                return;
            }

            console.log("Creating chart...");
            const container = document.getElementById('chart');
            chart = DXChart.createChart(container);
            console.log("Chart initialized successfully");
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error("Error initializing chart:", e);
        }
    }

    function drawRectangles(rects) {
        const container = document.getElementById('chart');
        container.querySelectorAll('.pattern-rect').forEach(el => el.remove());
        rects.forEach(r => {
            const x1 = chart.toXFromTimestamp(r.from);
            const x2 = chart.toXFromTimestamp(r.to);
            const y1 = chart.toY(r.high);
            const y2 = chart.toY(r.low);
            const div = document.createElement('div');
            div.className = 'pattern-rect';
            div.style.left = Math.min(x1, x2) + 'px';
            div.style.top = Math.min(y1, y2) + 'px';
            div.style.width = Math.abs(x2 - x1) + 'px';
            div.style.height = Math.abs(y2 - y1) + 'px';
            container.appendChild(div);
        });
    }

    window.updateChart = function(candlesJson, rectsJson) {
        if (!chart) {
            console.error("Chart not initialized. Call initializeChart first.");
            return;
        }
        try {
            const data = JSON.parse(candlesJson);
            chart.setData({ candles: data });
            if (data.length > 0) {
                chart.setTimestampRange(data[0].timestamp, data[data.length - 1].timestamp);
            }
            const rects = rectsJson ? JSON.parse(rectsJson) : [];
            drawRectangles(rects);
            console.log("Chart updated with data, count:", data.length);
        } catch (e) {
            console.error("Error updating chart:", e);
        }
    };

    window.onload = function() {
        console.log("Window loaded, initializing chart...");
        initializeChart();
    };
</script>
</body>
</html>

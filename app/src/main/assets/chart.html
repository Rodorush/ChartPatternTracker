<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/lightweight-charts@5.0.8/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #chart { width: 100%; height: 100%; position: relative; }
        #patterns-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .pattern-rect { position: absolute; border: 2px solid rgba(255, 165, 0, 0.8); background-color: rgba(255, 165, 0, 0.2); }
    </style>
</head>
<body>
<div id="chart"></div>
<script>
    console.log("Starting chart.html script execution");
    console.log("LightweightCharts available:", typeof LightweightCharts !== 'undefined');

    let chart;
    let candlestickSeries;
    let overlay;
    let currentPatterns = [];

    function initializeChart() {
        try {
            if (typeof LightweightCharts === 'undefined') {
                console.error("LightweightCharts is not loaded");
                return;
            }

            console.log("Creating chart...");
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                width: window.innerWidth,
                height: window.innerHeight,
                layout: { background: { color: '#ffffff' }, textColor: '#000000' },
                grid: { vertLines: { color: '#e0e0e0' }, horzLines: { color: '#e0e0e0' } },
                timeScale: { timeVisible: true, secondsVisible: false }
            });
            console.log("Chart created:", chart !== null && typeof chart === 'object');
            console.log("Chart has addCandlestickSeries:", typeof chart.addCandlestickSeries === 'function');
            console.log("Chart has addSeries:", typeof chart.addSeries === 'function');
            console.log("LightweightCharts.CandlestickSeries available:", typeof LightweightCharts.CandlestickSeries !== 'undefined');

            console.log("Adding candlestick series using addSeries...");
            candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: '#26A69A',
                downColor: '#EF5350',
                borderVisible: false,
                wickUpColor: '#26A69A',
                wickDownColor: '#EF5350'
            });

            overlay = document.createElement('div');
            overlay.id = 'patterns-overlay';
            container.appendChild(overlay);

            chart.timeScale().subscribeVisibleTimeRangeChange(() => drawPatternRectangles(currentPatterns));
            window.addEventListener('resize', () => {
                chart.resize(window.innerWidth, window.innerHeight);
                drawPatternRectangles(currentPatterns);
            });

            console.log("Chart initialized successfully");
            AndroidInterface.chartInitialized();
        } catch (e) {
            console.error("Error initializing chart:", e);
        }
    }

    function drawPatternRectangles(patterns) {
        currentPatterns = patterns;
        if (!overlay) return;
        overlay.innerHTML = '';
        const timeScale = chart.timeScale();
        const priceScale = candlestickSeries.priceScale();
        patterns.forEach(p => {
            const x1 = timeScale.timeToCoordinate(p.startTime);
            const x2 = timeScale.timeToCoordinate(p.endTime);
            const y1 = priceScale.priceToCoordinate(p.high);
            const y2 = priceScale.priceToCoordinate(p.low);
            if (x1 === null || x2 === null || y1 === null || y2 === null) {
                return;
            }
            const rect = document.createElement('div');
            rect.className = 'pattern-rect';
            rect.style.left = Math.min(x1, x2) + 'px';
            rect.style.width = Math.abs(x2 - x1) + 'px';
            rect.style.top = Math.min(y1, y2) + 'px';
            rect.style.height = Math.abs(y2 - y1) + 'px';
            overlay.appendChild(rect);
        });
    }

    window.updateChart = function(jsonData, patternsJson) {
        if (!chart || !candlestickSeries) {
            console.error("Chart not initialized. Call initializeChart first.");
            return;
        }
        try {
            const data = JSON.parse(jsonData);
            console.log("Raw data received:", data);

            // Verificar a última vela e ignorá-la se tiver OHLC com zero
            let finalData = data;
            if (data.length > 0) {
                const lastCandle = data[data.length - 1];
                console.log("Last candle:", lastCandle);
                if (lastCandle.open === 0 || lastCandle.high === 0 || lastCandle.low === 0 || lastCandle.close === 0) {
                    console.log("Ignoring last candle due to zero OHLC value");
                    finalData = data.slice(0, -1); // Remove a última vela
                }
            }

            candlestickSeries.setData(finalData);
            chart.timeScale().fitContent();
            console.log("Chart updated with data, count:", finalData.length);

            const patterns = JSON.parse(patternsJson || '[]');
            drawPatternRectangles(patterns);
        } catch (e) {
            console.error("Error updating chart:", e);
        }
    };

    window.onload = function() {
        console.log("Window loaded, initializing chart...");
        initializeChart();
    };
</script>
</body>
</html>
